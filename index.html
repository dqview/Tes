<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lutfi Control</title>
  <style>
    .Utama{
background-image:url("bg.jpg");
 width: 100%;
  min-height: 100vh;
    }
    #Tombol1{
        background-color: blue;
            width: 10%;
  min-height: 10vh;
  }
  #Tombol2{
        background-color: blue;
        width: 10%;
  min-height: 10vh;
  margin-top: 0px;
margin-right: 0px;
margin-bottom: 0px;
margin-left: 1%;
 }
 #Sta{
     background-color: rgb(0, 255, 60);
     width: 25%;
 }

  </style>
</head>
<body >
    <div class="Utama"> 
 <button id="Tombol1" onclick="fetch('/on')">ON</button>
 <button id="Tombol2" onclick="fetch('/off')">OFF</button><br>
 <p id="Sta">Status: <span id="status">---</span></p><br>
 <input id="judul" placeholder="Masukkan judul">
<button onclick="kirim()">Kirim</button>

<p id="siyu"></p>
    </div>
    </body>
    <script>
        let angka=0;
        function updateStatus() {
      fetch('/jem')
        .then(response => response.text())
        .then(data => {
          document.getElementById("status").innerHTML = data;
        });
    }
        function kirim() {
  const judul = document.getElementById("judul").value;

  fetch("/set?judul=" + encodeURIComponent(judul))
    .then(res => res.text())
    .then(data => {
      document.getElementById("siyu").innerText = data;
    })
    .catch(err => {
      document.getElementById("siyu").innerText = "Gagal kirim";
      console.error(err);
    });
}
    setInterval(updateStatus, 1000);
    </script>
</html>
