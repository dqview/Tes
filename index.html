<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MQTT Ngebacot</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial; padding:20px; background:#f4f6f9; }
    #messages {
      background:white;
      padding:10px;
      border-radius:8px;
      height:250px;
      overflow-y:auto;
      margin-bottom:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    .msg {
      padding:6px;
      border-bottom:1px solid #eee;
      font-size:14px;
    }
    input {
      padding:8px;
      width:70%;
    }
    button {
      padding:8px 15px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<h2>📡 MQTT Ngobrolt</h2>

<div id="messages"></div>

<input type="text" id="inputMsg" placeholder="Ketik pesan...">
<button onclick="kirimPesan()">Kirim</button>

<script>
  const topic = "hgsdksfst";
  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  const messagesDiv = document.getElementById("messages");
  const inputMsg = document.getElementById("inputMsg");

  // Saat terkoneksi
  client.on("connect", function () {
    console.log("Terhubung ke broker");
    client.subscribe(topic);
  });

  // Saat menerima pesan
  client.on("message", function (topic, message) {
    const newMsg = document.createElement("div");
    newMsg.className = "msg";
    newMsg.textContent = message.toString();
    messagesDiv.prepend(newMsg);
  });

  // Fungsi tombol kirim
  function kirimPesan() {
    const pesan = inputMsg.value;

    if (pesan !== "") {
      client.publish(topic, pesan);
      inputMsg.value = ""; // kosongkan input setelah kirim
    }
  }

  // Kirim pesan jika tekan Enter
  inputMsg.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      kirimPesan();
    }
  });

</script>

</body>
</html>
