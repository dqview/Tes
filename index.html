<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MQTT 2 Topic Dashboard</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#f4f6f9;
  padding:20px;
}

h2 { margin-bottom:10px; }

#status {
  font-weight:bold;
  margin-bottom:15px;
}
.sat {
/*background:#0a3f8e;*/
height: 5vh;
width: 50%;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
  margin-bottom:15px;
}

input, select {
  padding:2px;
  margin:5px 0;
  width:100%;
}

button {
  padding:10px;
  margin-top:10px;
  width:100%;
  cursor:pointer;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:5px;
}

#messages {
  max-height:300px;
  overflow-y:auto;
}

.msg {
  padding:8px;
  border-bottom:1px solid #eee;
  font-size:14px;
}
</style>
</head>

<body>

<h2>📡 MQTT JSON Dashboard</h2>
<div id="status">Status: Menghubungkan...</div>

<!-- Form Kirim Data -->
<div class="card">
  <h3>Kirim Data JSON</h3>
  <div class="sat"><p >Status: <span id="gtk">---</span></p><br></div><br>
  <label>Text:</label>
  <input type="input" id="suhu" placeholder="Masukkan suhu">

  <label>Kecerahan:</label>
  <input type="number" id="kelembaban" placeholder="Masukkan kelembaban">
   <label>Status:</label>
  <select id="statusDevice">
    <option value="ON">ON</option>
    <option value="OFF">OFF</option>
  </select>

  <button onclick="kirimJSON()">Kirim Data</button>
</div>

<!-- Tampilan Data Masuk -->
<div class="card">
  <h3>Data Diterima</h3>
  <div id="messages"></div>
</div>

<script>

// ====== TOPIC ======
const topicSensor = "hgsdksfst";
const topicKontrol = "jhdsghks";

// ====== CONNECT MQTT ======
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

const statusDiv = document.getElementById("status");
const messagesDiv = document.getElementById("messages");

// Saat terkoneksi
client.on("connect", function () {
  statusDiv.innerHTML = "Status: ✅ Terhubung ke broker.hivemq.com";
  client.subscribe(topicSensor);
  client.subscribe(topicKontrol);
  console.log("Subscribe ke 2 topic berhasil");
});

// Saat menerima pesan
client.on("message", function (topicName, message) {

  let isi = message.toString();
  console.log("Topic:", topicName);
 // console.log("Pesan:", isi);
  document.getElementById("gtk").innerHTML = isi;
 
  const newMsg = document.createElement("div");
  newMsg.className = "msg";

  // Jika JSON
 


  try {
    const data = JSON.parse(isi);
 if(topicName === topicSensor  ){
    newMsg.innerHTML =
      "<b>Topic:</b> " + topicName + "<br>" +
      "<b>Text:</b> " + (data.suhu ?? "-") + " °C<br>" +
      "<b>Kecerahan:</b> " + (data.kelembaban ?? "-") + " %<br>" +
      "<b>Status:</b> " + (data.status ?? "-") + "<br>" +
      "<b>Waktu:</b> " + (data.waktu ?? "-"); }

  } catch (e) {
    // Jika bukan JSON
    newMsg.innerHTML =
      "<b>Topic:</b> " + topicName + "<br>" +
      "<b>Pesan:</b> " + isi; 
  }
  
    if(topicName === topicSensor  ){
       messagesDiv.prepend(newMsg);}
});
  

// ====== FUNGSI KIRIM JSON ======
function kirimJSON() {
  
  const suhu = document.getElementById("suhu").value;
  const kelembaban = document.getElementById("kelembaban").value;
  const statusDevice = document.getElementById("statusDevice").value;

  if ( kelembaban === "") {
    alert("Isi semua data terlebih dahulu!");
    return;
  }

  const data = {
    suhu:(suhu),
    kelembaban: Number(kelembaban),
    status: statusDevice,
    waktu: new Date().toLocaleString()
  };

  // Kirim ke topic sensor
  client.publish(topicSensor, JSON.stringify(data));

  console.log("Data dikirim:", data);
}
 let angka=0;
    function updateStatus() {
      angka++;
     
    }
        setInterval(updateStatus, 1000);

</script>

</body>
</html>
