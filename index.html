<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MQTT Web Subscriber - HiveMQ</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial; background:#f4f6f9; padding:20px; }
    h2 { color:#333; }
    #status { margin-bottom:10px; font-weight:bold; }
    #messages {
      background:white;
      padding:15px;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      max-height:300px;
      overflow:auto;
    }
    .msg {
      padding:8px;
      border-bottom:1px solid #eee;
      font-size:14px;
    }
  </style>
</head>
<body>

<h2>📡 MQTT Web Subscriber (HiveMQ Public Broker)</h2>

<div id="status">Status: Menghubungkan...</div>
<div id="messages"></div>

<script>
  // Ganti topic sesuai kebutuhan
  const topic = "hgsdksfst";

  // Koneksi ke HiveMQ public broker via WebSocket
  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  const statusDiv = document.getElementById("status");
  const messagesDiv = document.getElementById("messages");

  client.on("connect", function () {
    statusDiv.innerHTML = "Status: ✅ Terhubung ke broker.hivemq.com";
    client.subscribe(topic);
  });

  client.on("message", function (topic, message) {
    const newMsg = document.createElement("div");
    newMsg.className = "msg";
    newMsg.innerHTML = "<b>Topic:</b> " + topic + 
                       "<br><b>Pesan:</b> " + message.toString();
    messagesDiv.prepend(newMsg);
  });

  client.on("error", function (err) {
    statusDiv.innerHTML = "Status: ❌ Error koneksi";
    console.error(err);
  });
</script>

</body>
</html>
